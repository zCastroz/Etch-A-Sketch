<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>Etch-A-Sketch</title>
</head>
<body>
    <main class="main-container">
        <h1>Etch-A-Sketch</h1>
        <div id="set-grid-container">
            <p>Grid:</p>
            <input id="set-grid"  min="1" max="64" type="range">
            <p id="grid-label">16x16</p>
        </div>
        <div id="square-grid"></div>
        <div class="buttons">
            <button id="color-mode" class="mode-button active-mode" >
                <p>Color: </p>
                <input id="color-picker"type="color">
            </button>
            <button id="rainbow-mode" class="mode-button">Rainbow</button>
            <button id="eraser-mode" class="mode-button">eraser</button>
            <button id="clear" class="mode-button">clear</button>
        </div>
        <footer>Copyright © 2023 zCastroz</footer>
    </main>
</body>
</html>
